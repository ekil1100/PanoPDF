name: Release desktop application

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const expected = `v${version}`;
          if (process.env.RELEASE_TAG !== expected) {
            console.error(`Release tag must match package.json: expected ${expected}, received ${process.env.RELEASE_TAG}`);
            process.exit(1);
          }
          NODE

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Build signed and notarized macOS installers
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          bun run dist --mac --${{ matrix.arch }} --publish never -c.forceCodeSigning=true
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(release/mac*/PanoPDF.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one packaged PanoPDF.app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          spctl --assess --type execute --verbose=2 "${apps[0]}"
      - name: Build Windows and Linux installers
        if: runner.os != 'macOS'
        run: bun run dist --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Install test browser
        if: runner.os == 'macOS'
        run: bunx playwright install chromium
      - name: Test Electron workflows
        if: runner.os == 'macOS'
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            installers/*.dmg
            installers/*.zip
            installers/*.exe
            installers/*.AppImage
